# The srcmorph-selftest configuration of srcmorph-maven-plugin (srcmorph-selftest.yaml) for the CLI,
# nearly 1:1 (BuildYourOwnJarSelfTestParityTest checks the models and rules against it). What run.sh /
# run.bat do with it: every file under baseDirectory/subtrees with one of the fileExtensions is
# matched to a rule in rules; the rule names a prompt (promptKey) and a model
# (aiDefinitionKey). srcmorph sends the prompt as the system message and the file's name and source as
# the user message, and writes the model's answer to outputDirectory as <file>.ai.md.
#
# Three models: gpt-oss-20b for every file up to ~275 KB, every package and the project overview;
# IBM Granite 4.0 for larger files - H-Tiny map-reducing over a 64K window up to ~1 MB, H-1B with a
# 16K window beyond, summarizing a few sampled chunks (sampleChunks). A Java, SQL, shell, Perl or XML
# summary starts with exact whole-file counts (factsKey: INSERT statements, VALUES rows, tables,
# methods, ...), so a sampled summary of a multi-MB SQL dump still states what the data holds.
#
# command:
#   Plan               prints which file gets which model and prompt; loads nothing, writes nothing
#   GenerateFileIndex  one .ai.md per source file
#   All                GenerateFileIndex, then one summary per package (packageRules) and
#                      the project index with an overview (projectRules)
# Start with Plan, then switch to GenerateFileIndex or All. A second run only redoes changed files.
command: Plan

# The package and the project phase have rules of their own (the plugin's aggregate-packages and
# aggregate-project goals read them from the same file).
packageRules:
  - promptKey: package-body
    onIncomplete: retryOnce                # an answer cut off or empty is asked for once more
    mapPromptKey: map-chunk
    reducePromptKey: reduce-parts
    aiDefinitionKey: gpt-oss-20B-mxfp4
projectRules:
  - promptKey: project-body
    onIncomplete: retryOnce
    mapPromptKey: map-chunk
    reducePromptKey: reduce-parts
    aiDefinitionKey: gpt-oss-20B-mxfp4

srcMorph:
  # On Windows use forward slashes ("C:/path/to/project"): in a double-quoted YAML string, "C:\x" is
  # an escape.
  baseDirectory: "/path/to/project"
  outputDirectory: "/path/to/project/target/srcmorph-ai"
  subtrees:
    - "src/main/java"
  fileExtensions:
    - ".java"
    - ".sql"
    - ".sh"
    - ".bash"
    - ".ksh"
    - ".zsh"
    - ".bats"
    - ".pl"
    - ".pm"
    - ".t"
    - ".cgi"
    - ".psgi"
    - ".xml"
    - ".xsd"
    - ".xsl"
    - ".xslt"
    - ".wsdl"
    - ".xhtml"
  excludes:
    - "**/package-info.java"
    - "**/module-info.java"

  # When a summary is rewritten. force: true rewrites every one. Otherwise a summary is rewritten when
  # it is missing or empty, its aiVersion changed, or a change below whose switch is true (each one is
  # by default); false keeps the summary and records the new value at its next rewrite.
  force: false
  regenerateOn:
    source: true                             # C: the file's source, a package's files, the project's packages
    prompt: true                             # P: the rule's prompts, its map and reduce prompts too
    facts: true                              # N: the rule's fact counters
    model: true                              # M: the rule's model (definition key, remoteModel, model file)
    children: true                           # K: the summaries a package or the project is written from

  generationProvider: llamacpp-jni      # "mock" runs without a model, for a dry test of the setup
  modelDirectory: "/path/to/models"     # a relative modelPath below is relative to this directory

  # The profile: the measured prompts and fact counters of this repository (profiles/README.md), one
  # file per key. A rule's promptKey names <profileDirectory>/<key>.md, its factsKey
  # <profileDirectory>/<key>.tsv (label TAB regex per line). Relative to this file's directory, as
  # every relative path here; copy the directory and point profileDirectory at the copy to change it.
  profileDirectory: "../../profiles/v3"

  aiDefinitions:
    # gpt-oss-20b in its native MXFP4: reasoningEffort low (best for dense summaries), a 96K window
    # (costs RAM, not time: ~12 GB model + ~11 GB KV when full), temp 0.7 with min-p 0.05.
    - key: gpt-oss-20B-mxfp4
      modelPath: gpt-oss-20b-mxfp4.gguf
      contextSize: 98304
      maxOutputTokens: 6144
      temperature: 0.7
      threads: 8                        # more only after measuring, never more than cores
      charsPerToken: 3
      warnOnTrim: true
      topP: 1.0
      topK: 0
      minP: 0.05
      repeatPenalty: 1.0
      reasoningEffort: low
    # ~275 KB .. ~1 MB: Granite 4.0 H-Tiny map-reduces over a 64K window, every chunk read. One pass
    # over a 384K window fits 8 GB (the KV grows only linearly), but over an 870 KB catalog it copied
    # the XML with invented values instead of summarizing it.
    - key: granite-4.0-h-tiny-mapreduce
      modelPath: granite-4.0-h-tiny-Q4_K_M.gguf
      contextSize: 65536
      maxOutputTokens: 4096
      temperature: 0.2
      threads: 8
      charsPerToken: 3
      warnOnTrim: true
      topP: 1.0
      topK: 0
      minP: 0.05
      repeatPenalty: 1.0
      reasoningEffort: ""               # Granite has no gpt-oss reasoning channels
    # Larger than ~1 MB: map-reduce over a SMALL 16K window (cheap prefill per chunk), maxChunks
    # sampled chunks (head, tail, spread) per file, next to the exact facts.
    - key: granite-4.0-h-1b-fastchunk
      modelPath: granite-4.0-h-1b-Q4_K_M.gguf
      contextSize: 16384
      maxOutputTokens: 1536
      temperature: 0.2
      threads: 8
      charsPerToken: 3
      warnOnTrim: true
      topP: 1.0
      topK: 0
      minP: 0.05
      repeatPenalty: 1.0
      reasoningEffort: ""

  # By priority, the most specific wins: huge (>1 MB) -> H-1B over sampled chunks, big
  # (~275 KB .. 1 MB) -> H-Tiny map-reduce, then gpt-oss for Java, SQL and every other file.
  rules:
    # Files that hold credentials are never sent to a model, whatever their extension: the highest
    # priority, so no other rule takes them. The prompts name a secret and never copy it; this keeps
    # the file out altogether. fileNames match the name in any case.
    - id: secrets
      skip: true
      priority: 1000
      condition:
        fileNames:
          - ".env"
          - ".env.*"
          - "*.tfvars"
          - "*.tfstate"
          - "*.tfstate.backup"
          - "settings.xml"                   # Maven: server passwords
          - "settings-security.xml"
          - "*.pem"
          - "*.key"
          - "id_rsa*"
          - "id_ed25519*"
          - "vault*.{yml,yaml}"
          - "*{secret,secrets,credential,credentials}*.{yml,yaml,properties,json,xml,conf,env}"
    - id: huge-java
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 200
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks          # maxChunks of the chunks; mapReduce would read every one,
                                        # sample only the head, deterministic call no model
      maxChunks: 6
      factsKey: java-facts
      condition:
        and:
          conditions:
            - extensions: [".java"]
            - size: {min: 1000000}
    - id: huge-sql
      promptKey: file-body-sql
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 200
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks
      maxChunks: 6
      factsKey: sql-facts
      condition:
        and:
          conditions:
            - extensions: [".sql"]
            - size: {min: 1000000}
    - id: big-java
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 100
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: java-facts
      condition:
        and:
          conditions:
            - extensions: [".java"]
            - size: {min: 275000}
    - id: big-sql
      promptKey: file-body-sql
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 100
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: sql-facts
      condition:
        and:
          conditions:
            - extensions: [".sql"]
            - size: {min: 275000}
    - id: java
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      factsKey: java-facts
      condition:
        extensions: [".java"]
    - id: sql
      promptKey: file-body-sql
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      factsKey: sql-facts
      condition:
        extensions: [".sql"]
    - id: huge-xml                      # big XML data takes the Java/SQL size tiers too, with the XML
                                        # prompt: three runs each per tier (MODEL-CARD finding 7)
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 200
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks
      maxChunks: 6
      factsKey: xml-facts
      condition:
        and:
          conditions:
            - extensions: [".xml", ".xsd", ".xsl", ".xslt", ".wsdl", ".xhtml"]
            - size: {min: 1000000}
    - id: big-xml
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 100
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: xml-facts
      condition:
        and:
          conditions:
            - extensions: [".xml", ".xsd", ".xsl", ".xslt", ".wsdl", ".xhtml"]
            - size: {min: 275000}
    - id: huge-pom                      # a big POM takes the XML tiers one step higher, with the Maven counters
      promptKey: file-body-fallback
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 210
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks
      maxChunks: 6
      factsKey: pom-facts
      condition:
        and:
          conditions:
            - pathGlob: "**/*pom.xml"
            - size: {min: 1000000}
    - id: big-pom
      promptKey: file-body-fallback
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 110
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: pom-facts
      condition:
        and:
          conditions:
            - pathGlob: "**/*pom.xml"
            - size: {min: 275000}
    - id: shell                         # shell, Perl, XML: a prompt and counts of their own
      promptKey: file-body-shell
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      factsKey: shell-facts
      condition:
        extensions: [".sh", ".bash", ".ksh", ".zsh", ".bats"]
    - id: perl
      promptKey: file-body-perl
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      factsKey: perl-facts
      condition:
        extensions: [".pl", ".pm", ".t", ".cgi", ".psgi"]
    - id: pom                           # matches xml too; the priority gives a POM the Maven counters
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      priority: 10
      factsKey: pom-facts
      condition:
        pathGlob: "**/*pom.xml"
    - id: xml
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      factsKey: xml-facts
      condition:
        extensions: [".xml", ".xsd", ".xsl", ".xslt", ".wsdl", ".xhtml"]
    - id: fallback                      # the rule for every file no other rule matches
      promptKey: file-body-fallback
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      fallback: true
