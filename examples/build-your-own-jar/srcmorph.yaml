# The srcmorph-selftest configuration of srcmorph-maven-plugin (srcmorph-selftest.yaml) for the CLI,
# nearly 1:1 (BuildYourOwnJarSelfTestParityTest checks the models and rules against it). What run.sh /
# run.bat do with it: every file under baseDirectory/subtrees with one of the fileExtensions is
# matched to a rule in rules; the rule names a prompt (promptKey) and a model
# (aiDefinitionKey). srcmorph sends the prompt as the system message and the file's name and source as
# the user message, and writes the model's answer to outputDirectory as <file>.ai.md.
#
# Three models: gpt-oss-20b for every package, the project overview and every file but the large
# Java, SQL, POM and plain XML files; IBM Granite 4.0 for those from ~260 KB - H-Tiny map-reducing
# over a 64K window up to ~1 MB, H-1B with a 16K window beyond, summarizing a few sampled chunks
# (sampleChunks). Every other kind stays on gpt-oss at any size: a 500 KB shell script, Kotlin file
# or MyBatis mapper is read chunk by chunk (map-reduce). Most summaries
# start with exact whole-file counts (factsKey: INSERT statements, VALUES rows, tables, methods,
# services, keys, ...), so a sampled summary of a multi-MB SQL dump still states what the data holds.
#
# What is indexed: only the files below src/main/java (subtrees; the plugin's self-test names two
# packages of the core library there instead), so in a standard Maven layout that is the Java
# sources, and the SQL, XML, POM, CI, Dockerfile, shell and other rules below find nothing:
# src/main/resources, the pom.xml, .github/ and the scripts lie outside. To index the whole project, set
#   subtrees: ["."]
# and add to excludes what is no source, e.g. "**/target/**" (the outputDirectory below lies there),
# "**/.git/**", "**/.idea/**", "**/node_modules/**"; then every file with one of the fileExtensions
# or fileNames takes its rule. Run Plan first: it lists every file and its rule.
#
# command:
#   Plan               prints which file gets which model and prompt; loads nothing, writes nothing
#   GenerateFileIndex  one .ai.md per source file
#   All                GenerateFileIndex, then one summary per package (packageRules) and
#                      the project index with an overview (projectRules)
# Start with Plan, then switch to GenerateFileIndex or All. A second run only redoes changed files.
command: Plan

# The package and the project phase have rules of their own (the plugin's aggregate-packages and
# aggregate-project goals read them from the same file).
packageRules:
  - promptKey: package-body
    onIncomplete: retryOnce                # an answer cut off or empty is asked for once more
    mapPromptKey: map-chunk
    reducePromptKey: reduce-parts
    aiDefinitionKey: gpt-oss-20B-mxfp4
projectRules:
  - promptKey: project-body
    onIncomplete: retryOnce
    mapPromptKey: map-chunk
    reducePromptKey: reduce-parts
    aiDefinitionKey: gpt-oss-20B-mxfp4

srcMorph:
  # On Windows use forward slashes ("C:/path/to/project"): in a double-quoted YAML string, "C:\x" is
  # an escape.
  baseDirectory: "/path/to/project"
  outputDirectory: "/path/to/project/target/srcmorph-ai"
  subtrees:
    - "src/main/java"
  fileExtensions:
    - ".java"
    - ".sql"
    - ".sh"
    - ".bash"
    - ".ksh"
    - ".zsh"
    - ".bats"
    - ".pl"
    - ".pm"
    - ".t"
    - ".cgi"
    - ".psgi"
    - ".xml"
    - ".xsd"
    - ".xsl"
    - ".xslt"
    - ".wsdl"
    - ".xhtml"
    - ".ts"
    - ".mts"
    - ".cts"
    - ".jsp"
    - ".jspf"
    - ".jspx"
    - ".tag"
    - ".tagx"
    - ".bpmn"
    - ".dmn"
    - ".yml"
    - ".yaml"
    - ".proto"
    - ".tf"
    - ".hcl"
    - ".kt"
    - ".kts"
    - ".groovy"
    - ".gvy"
    - ".gradle"
    - ".scala"
    - ".avsc"
    - ".graphql"
    - ".graphqls"
    - ".gql"
    - ".properties"
    - ".ps1"
    - ".psm1"
    - ".bat"
    - ".cmd"
  fileNames:
    - "Dockerfile"
    - "Dockerfile.*"
    - "*.dockerfile"
    - "Containerfile"
    - "Jenkinsfile"
    - "package.json"
    - "openapi*.json"
    - "swagger*.json"
    - "asyncapi*.json"
    - "pyproject.toml"
  excludes:
    - "**/package-info.java"
    - "**/module-info.java"

  # When a summary is rewritten. force: true rewrites every one. Otherwise a summary is rewritten when
  # it is missing or empty, its aiVersion changed, or a change below whose switch is true (each one is
  # by default); false keeps the summary and records the new value at its next rewrite.
  force: false
  regenerateOn:
    source: true                             # C: the file's source, a package's files, the project's packages
    prompt: true                             # P: the rule's prompts, its map and reduce prompts too
    facts: true                              # N: the rule's fact counters
    model: true                              # M: the rule's model (definition key, remoteModel, model file)
    children: true                           # K: the summaries a package or the project is written from

  generationProvider: llamacpp-jni      # "mock" runs without a model, for a dry test of the setup
  modelDirectory: "/path/to/models"     # a relative modelPath below is relative to this directory

  # The profile: the measured prompts and fact counters of this repository (profiles/README.md), one
  # file per key. A rule's promptKey names <profileDirectory>/<key>.md, its factsKey
  # <profileDirectory>/<key>.tsv (label TAB regex per line). Relative to this file's directory, as
  # every relative path here; copy the directory and point profileDirectory at the copy to change it.
  profileDirectory: "../../profiles/v3"

  aiDefinitions:
    # gpt-oss-20b in its native MXFP4: reasoningEffort low (best for dense summaries), a 96K window
    # (costs RAM, not time: ~12 GB model + ~11 GB KV when full), temp 0.7 with min-p 0.05.
    - key: gpt-oss-20B-mxfp4
      modelPath: gpt-oss-20b-mxfp4.gguf
      contextSize: 98304
      maxOutputTokens: 6144
      temperature: 0.7
      threads: 8                        # more only after measuring, never more than cores
      charsPerToken: 3
      warnOnTrim: true
      topP: 1.0
      topK: 0
      minP: 0.05
      repeatPenalty: 1.0
      reasoningEffort: low
    # ~260 KB .. ~1 MB: Granite 4.0 H-Tiny map-reduces over a 64K window, every chunk read. One pass
    # over a 384K window fits 8 GB (the KV grows only linearly), but over an 870 KB catalog it copied
    # the XML with invented values instead of summarizing it.
    - key: granite-4.0-h-tiny-mapreduce
      modelPath: granite-4.0-h-tiny-Q4_K_M.gguf
      contextSize: 65536
      maxOutputTokens: 4096
      temperature: 0.2
      threads: 8
      charsPerToken: 3
      warnOnTrim: true
      topP: 1.0
      topK: 0
      minP: 0.05
      repeatPenalty: 1.0
      reasoningEffort: ""               # Granite has no gpt-oss reasoning channels
    # Larger than ~1 MB: map-reduce over a SMALL 16K window (cheap prefill per chunk), maxChunks
    # sampled chunks (head, tail, spread) per file, next to the exact facts.
    - key: granite-4.0-h-1b-fastchunk
      modelPath: granite-4.0-h-1b-Q4_K_M.gguf
      contextSize: 16384
      maxOutputTokens: 1536
      temperature: 0.2
      threads: 8
      charsPerToken: 3
      warnOnTrim: true
      topP: 1.0
      topK: 0
      minP: 0.05
      repeatPenalty: 1.0
      reasoningEffort: ""

  # By priority, the most specific wins. Java, SQL, POM and plain XML files have size tiers: huge
  # (>1 MB) -> H-1B over sampled chunks, big (~260 KB .. 1 MB) -> H-Tiny map-reduce; below them, and
  # every other kind at any size, gpt-oss. gpt-oss reads about 270,000 characters of source (the 96K
  # window less the output budget and the prompt), so the tiers start at 260,000 (a size condition
  # measures the source's bytes with \n line endings). Every gpt-oss rule map-reduces a file that
  # still exceeds the window (one denser than the plan's 3 characters per token below a tier, or a
  # kind without tiers: shell, Perl, Kotlin, a descriptor or mapper of an XML kind, ... the fallback)
  # instead of failing the run.
  rules:
    # Files that hold credentials are never sent to a model, whatever their extension: the highest
    # priority, so no other rule takes them. The prompts name a secret and never copy it; this keeps
    # the file out altogether. fileNames match the name in any case.
    - id: secrets
      skip: true
      priority: 1000
      condition:
        or:
          conditions:
            - fileNames:
                - ".env"
                - ".env.*"
                - "*.tfvars"
                - "*.pkrvars.hcl"                # Packer's variable values, as Terraform's .tfvars
                - "*.tfstate"
                - "*.tfstate.backup"
                - "settings-security.xml"
                - "*.pem"
                - "*.key"
                - "id_rsa*"
                - "id_ed25519*"
            - and:                               # Maven's settings.xml (server passwords) by its root
                conditions:                      # element, not an Android res/xml/settings.xml
                  - fileNames: ["settings.xml"]
                  - contentMatches: '<settings[\s>]'
            # A properties file that gives a password, secret, token or API key a value, whatever its
            # name (gradle.properties, application.properties); a value that only names an environment
            # variable or another property (${DB_PASSWORD}) is none. Read in the file's head.
            - and:
                conditions:
                  - extensions: [".properties"]
                  - contentMatches: '(?im)^[ \t]*+[\w.\-]*?(?:password|passwd|secret|token|api[._-]?key)[ \t]*+[=:][ \t]*+(?!\$\{)\S'
            # A Kubernetes Secret, whatever its name (deploy/postgres.yaml): its data are the
            # credentials. Not a Helm chart's template, which names the values it renders. Read in the
            # file's head, so a Secret in a later document of a long multi-document file is not seen.
            - and:
                conditions:
                  - extensions: [".yml", ".yaml"]
                  - contentMatches: '(?m)^kind:[ \t]*["'']?Secret\b'
                  - not:
                      and:
                        conditions:
                          - pathGlob: "**/templates/**"
                          - contentMatches: '\{\{'
            # A file named for a vault, secrets or credentials, but not a CI workflow or action
            # (secret-scan.yml), a Helm chart's template (it names the values it renders) or a
            # Kubernetes manifest of another kind than Secret (vault-deployment.yaml).
            - and:
                conditions:
                  - fileNames:
                      - "vault*.{yml,yaml}"
                      - "*{secret,secrets,credential,credentials}*.{yml,yaml,properties,json,xml,conf,env,hcl}"
                  - not:
                      or:
                        conditions:
                          - pathGlob: "**/.github/**"
                          - and:
                              conditions:
                                - pathGlob: "**/templates/**"
                                - contentMatches: '\{\{'
                          - and:
                              conditions:
                                - contentMatches: '(?m)^kind:[ \t]*["'']?[A-Z]'
                                - not:
                                    contentMatches: '(?m)^kind:[ \t]*["'']?Secret\b'
    - id: huge-java
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 200
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks          # maxChunks of the chunks; mapReduce would read every one,
                                        # sample only the head, deterministic call no model
      maxChunks: 6
      factsKey: java-facts
      condition:
        and:
          conditions:
            - extensions: [".java"]
            - size: {min: 1000000}
    - id: huge-sql
      promptKey: file-body-sql
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 200
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks
      maxChunks: 6
      factsKey: sql-facts
      condition:
        and:
          conditions:
            - extensions: [".sql"]
            - size: {min: 1000000}
    - id: big-java
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 100
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: java-facts
      condition:
        and:
          conditions:
            - extensions: [".java"]
            - size: {min: 260000}
    - id: big-sql
      promptKey: file-body-sql
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 100
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: sql-facts
      condition:
        and:
          conditions:
            - extensions: [".sql"]
            - size: {min: 260000}
    - id: java
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: java-facts
      condition:
        extensions: [".java"]
    - id: sql
      promptKey: file-body-sql
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: sql-facts
      condition:
        extensions: [".sql"]
    # Big plain XML data takes the Java/SQL size tiers too, with the XML prompt: three runs each per
    # tier (MODEL-CARD finding 7). Only what the xml rule takes: the tiers outrank every kind rule
    # (priority 100 and 200 against 10 and 11), so they leave out the files a kind rule takes, and a
    # big descriptor, mapper or route file keeps its kind's counters on gpt-oss, which map-reduces it.
    # By extension: .wsdl and .xhtml are not in the list (the wsdl and facelets rules). By name or
    # content: the `not` holds the conditions of jee, mybatis, bpmn (its .bpmn20.xml), persistence and
    # integration, copied from those rules in their order (ExamplesConfigBindingTest compares them); a
    # new XML kind rule that matches by name or content adds its condition there, in both tiers. A POM
    # takes the POM tiers, one priority higher.
    - id: huge-xml
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 200
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks
      maxChunks: 6
      factsKey: xml-facts
      condition:
        and:
          conditions:
            - extensions: [".xml", ".xsd", ".xsl", ".xslt"]
            - size: {min: 1000000}
            - not:                           # the XML kind rules' own conditions, as in big-xml
                or:
                  conditions:
                    - fileNames: ["web.xml", "web-fragment.xml", "ejb-jar.xml", "application.xml"]   # jee
                    - contentMatches: 'mybatis\.org//DTD Mapper'                                     # mybatis
                    - fileNames: ["*.bpmn20.xml"]                                                    # bpmn
                    - fileNames: ["persistence.xml", "orm.xml", "*.hbm.xml"]                         # persistence
                    - contentMatches: 'camel\.apache\.org/schema|springframework\.org/schema/integration|mulesoft\.org/schema/mule|ws\.apache\.org/ns/synapse'
    - id: big-xml
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 100
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: xml-facts
      condition:
        and:
          conditions:
            - extensions: [".xml", ".xsd", ".xsl", ".xslt"]
            - size: {min: 260000}
            - not:                           # the XML kind rules' own conditions, as in huge-xml
                or:
                  conditions:
                    - fileNames: ["web.xml", "web-fragment.xml", "ejb-jar.xml", "application.xml"]   # jee
                    - contentMatches: 'mybatis\.org//DTD Mapper'                                     # mybatis
                    - fileNames: ["*.bpmn20.xml"]                                                    # bpmn
                    - fileNames: ["persistence.xml", "orm.xml", "*.hbm.xml"]                         # persistence
                    - contentMatches: 'camel\.apache\.org/schema|springframework\.org/schema/integration|mulesoft\.org/schema/mule|ws\.apache\.org/ns/synapse'
    - id: huge-pom                      # a big POM takes the XML tiers one step higher, with the Maven counters
      promptKey: file-body-fallback
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-1b-fastchunk
      priority: 210
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: sampleChunks
      maxChunks: 6
      factsKey: pom-facts
      condition:
        and:
          conditions:
            - pathGlob: "**/*pom.xml"
            - size: {min: 1000000}
    - id: big-pom                       # measured 2026-11-06 on a real 590 KB POM: the XML prompt invents no names, the generic one half
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: granite-4.0-h-tiny-mapreduce
      priority: 110
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      onOversize: mapReduce
      factsKey: pom-facts
      condition:
        and:
          conditions:
            - pathGlob: "**/*pom.xml"
            - size: {min: 260000}
    - id: shell                         # shell, Perl, XML: a prompt and counts of their own
      promptKey: file-body-shell
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: shell-facts
      condition:
        extensions: [".sh", ".bash", ".ksh", ".zsh", ".bats"]
    - id: perl
      promptKey: file-body-perl
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: perl-facts
      condition:
        extensions: [".pl", ".pm", ".t", ".cgi", ".psgi"]
    - id: pom                           # matches xml too; the priority gives a POM the Maven counters
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: pom-facts
      condition:
        pathGlob: "**/*pom.xml"
    - id: xml
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: xml-facts
      condition:
        extensions: [".xml", ".xsd", ".xsl", ".xslt"]          # .wsdl and .xhtml have rules of their own
    - id: typescript                         # the oop prompt names more of a TypeScript file's API than
      promptKey: file-body-oop               # the fallback (measured 2026-11-05); no counters of its own
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      condition:
        extensions: [".ts", ".mts", ".cts"]
    - id: jee                                # Jakarta EE descriptors
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: jee-facts
      condition:
        fileNames: ["web.xml", "web-fragment.xml", "ejb-jar.xml", "application.xml"]
    - id: mybatis
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: mybatis-facts
      condition:
        and:
          conditions:
            - extensions: [".xml"]
            - contentMatches: 'mybatis\.org//DTD Mapper'
    - id: bpmn
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: bpmn-facts
      condition:
        or:
          conditions:
            - extensions: [".bpmn"]
            - fileNames: ["*.bpmn20.xml"]        # Flowable and Activiti, over the xml rule
    - id: dmn
      promptKey: file-body-xml
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: dmn-facts
      condition:
        extensions: [".dmn"]
    - id: jsp
      promptKey: file-body-view
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: jsp-facts
      condition:
        extensions: [".jsp", ".jspf", ".tag"]
    - id: jspx                               # a JSP document is XML: its comments are never sent
      promptKey: file-body-view
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: jspx-facts
      condition:
        extensions: [".jspx", ".tagx"]
    - id: proto
      promptKey: file-body-contract
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: proto-facts
      condition:
        extensions: [".proto"]
    - id: actions
      promptKey: file-body-ops
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: actions-facts
      condition:
        pathGlob: "**/.github/{workflows,actions}/**/*.{yml,yaml}"
    - id: k8s                                # Kubernetes manifests and Helm templates
      promptKey: file-body-ops
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 5
      factsKey: k8s-facts
      condition:
        and:
          conditions:
            - extensions: [".yml", ".yaml"]
            - contentMatches: '(?m)^kind:[ \t]*["'']?[A-Z]'   # kind: Deployment, quoted too
    - id: dockerfile
      promptKey: file-body-ops
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: dockerfile-facts
      condition:
        fileNames: ["Dockerfile", "Dockerfile.*", "*.dockerfile", "Containerfile"]
    - id: terraform
      promptKey: file-body-ops
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      factsKey: terraform-facts
      condition:
        extensions: [".tf", ".hcl"]
    - id: npm                                # an npm manifest: the ops prompt has a line for it (measured
      promptKey: file-body-ops               # 2026-11-06 on an extension's manifest)
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      priority: 10
      factsKey: npm-facts
      condition:
        fileNames: ["package.json"]
    - id: ops                                # every other YAML, Jenkinsfile
      promptKey: file-body-ops
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      condition:
        or:
          conditions:
            - extensions: [".yml", ".yaml"]
            - fileNames: ["Jenkinsfile", ".gitlab-ci.yml"]
    - id: kotlin                             # the prompt Java, Kotlin, Groovy, Scala share
      promptKey: file-body-oop
      onIncomplete: retryOnce
      aiDefinitionKey: gpt-oss-20B-mxfp4
      factsKey: kotlin-facts
      onOversize: mapReduce
      mapPromptKey: map-chunk
      reducePromptKey: reduce-parts
      condition:
        extensions: [".kt", ".kts"]
    - id: groovy
      promptKey: file-body-oop
      onIncomplete: retryOnce
