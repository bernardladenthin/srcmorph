# One model of a GitHub Copilot subscription through the GitHub Copilot API Gateway VS Code
# extension, on this machine at 127.0.0.1:3030. Set the gateway up first: docs/copilot-api-gateway.md.
# Every file is sent to GitHub Copilot and costs one request of the plan's quota.
#
# command:
#   Plan               prints which file gets which model and prompt; sends nothing, writes nothing
#   GenerateFileIndex  one .ai.md per source file
#   ListModels         prints the gateway's models and an aiDefinitions entry per model, built from
#                      the one below; sends no prompt, writes nothing. modelFilter narrows the list.
# Start with Plan, then switch to GenerateFileIndex. A second run only redoes changed files.
command: Plan
# modelFilter: "claude"

srcMorph:
  # On Windows use forward slashes ("C:/path/to/project"): in a double-quoted YAML string, "C:\x" is
  # an escape.
  baseDirectory: "/path/to/project"
  outputDirectory: "/path/to/project/target/srcmorph-ai"
  subtrees:
    - "src/main/java"
  fileExtensions:
    - ".java"

  generationProvider: openai-compatible

  # The profile: the measured prompts of this repository (profiles/README.md), one file per key. A
  # rule's promptKey names <profileDirectory>/<key>.md; the directory is relative to the working
  # directory (start srcmorph from this one). Copy it and point profileDirectory at the copy to change
  # a prompt.
  profileDirectory: "../../profiles/v2"

  aiDefinitions:
    - key: copilot
      provider: openai-compatible
      baseUrl: "http://127.0.0.1:3030/v1"   # plain http carries the key to a loopback host only
      remoteModel: claude-haiku-4.5          # an id from GET /v1/models of the gateway
      apiKeyEnv: COPILOT_GATEWAY_API_KEY     # the NAME of the variable holding the gateway's apiKey
      stream: true                           # required: the gateway's non-streaming path adds and runs VS Code tools
      requestsPerMinute: 25                  # below the gateway's rateLimitPerMinute (30): wait instead of a 429
      contextSize: 32768                     # at most the model's max_input_tokens
      maxOutputTokens: 4096                  # the v1 prompt asks for a structured summary of every section
      temperature: 0.2

  fieldGenerations:
    - promptKey: file-body-java
      aiDefinitionKey: copilot
      fallback: true                         # the rule for every file no other rule matches
      onOversize: sample                     # default "fail" stops the run on a file larger than the window
