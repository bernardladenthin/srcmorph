command: GenerateFileIndex
srcMorph:
  baseDirectory: "."
  outputDirectory: "target/srcmorph-ai"
  subtrees:
    - "src/main/java"
  fileExtensions:
    - ".java"
  generationProvider: mock
  profileDirectory: "../profiles/v2"   # the measured prompts of this repository, see profiles/README.md
  aiDefinitions:
    - key: mock-model
      modelPath: unused-with-mock-provider.gguf
      contextSize: 2048
      maxOutputTokens: 64
      temperature: 0.15
      threads: 2
  fieldGenerations:
    - promptKey: file-body-fallback
      aiDefinitionKey: mock-model
      fallback: true
