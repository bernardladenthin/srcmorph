version = 1
SPDX-PackageName = "srcmorph"
SPDX-PackageSupplier = "Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/bernardladenthin/srcmorph"

[[annotations]]
path = [
    "**.md",
    "CITATION.cff",
    "srcmorph-maven-plugin/src/site/ai/empty.md",
    "docs/RELEASE.md",
    # JSON/YAML example configuration fixtures (no comment syntax; same precedent as
    # BitcoinAddressFinder's examples/config_*.json entries in its own REUSE.toml).
    "examples/config_Plan.json",
    "examples/config_GenerateFileIndex.json",
    "examples/config_GenerateFileIndex.yaml",
    "examples/config_All.json",
    "examples/config_Calibrate.json",
    # Pre-existing private test fixtures, same "no comment syntax" JSON/YAML precedent.
    "srcmorph-cli/src/test/resources/test-fixtures/minimal-generate.json",
    "srcmorph-cli/src/test/resources/test-fixtures/minimal-generate.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "srcmorph/src/test/resources/SmolLM2-135M-Instruct-Q3_K_M.gguf"
precedence = "aggregate"
SPDX-FileCopyrightText = "HuggingFaceTB"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "LICENSE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Project logo / branding assets (binary PNG + generated SVG with a base64-embedded
# font, neither of which can carry an inline SPDX header without corruption). Dual
# MIT OR Apache-2.0, the same license the author ships them under in the workspace
# repo (the embedded Martian Mono font is OFL-1.1; only the standalone .ttf — not
# shipped here — carries that identifier).
[[annotations]]
path = [
    "docs/branding/srcmorph.svg",
    "docs/branding/srcmorph.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Model-card benchmark data (JSON/TSV without comment syntax): the model list, the prompts, the
# expected facts, the search questions, the per-model run metadata (also of the repeat runs) and the
# scores computed from the outputs, plus the charts plot.py draws from them.
[[annotations]]
path = [
    "docs/ai-index-benchmark/modelcard/*.json",
    "docs/ai-index-benchmark/modelcard/runs/*.json",
    "docs/ai-index-benchmark/modelcard/scores/*.json",
    "docs/ai-index-benchmark/modelcard/scores/*.tsv",
    "docs/ai-index-benchmark/modelcard/charts/*.svg",
    "docs/ai-index-benchmark/repeat-2026-10/*/meta/*.json",
    "docs/ai-index-benchmark/repeat-2026-10/*/search.json",
    "docs/ai-index-benchmark/repeat-2026-10/*/search.tsv",
    "docs/ai-index-benchmark/prompt-v2-2026-10/*/meta/*.json",
    "docs/ai-index-benchmark/prompt-v2-2026-10/*/search.json",
    "docs/ai-index-benchmark/prompt-v2-2026-10/*/search.tsv",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The issue/PR templates are templates of bernardladenthin/actions (templates/common), checked by
# its check-templates action, and carry the license of the other template files.
# Last in this file on purpose: of several matching annotations the last one applies.
[[annotations]]
path = [
    ".github/ISSUE_TEMPLATE/bug_report.md",
    ".github/ISSUE_TEMPLATE/feature_request.md",
    ".github/PULL_REQUEST_TEMPLATE.md",
]
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"
