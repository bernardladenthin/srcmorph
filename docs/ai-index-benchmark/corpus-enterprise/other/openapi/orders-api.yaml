openapi: 3.0.3
info:
  title: Shop Orders API
  version: 2.1.0
  description: |
    Read and change orders of the shop backoffice.
    The legacy endpoint /v1/orders/export: was removed in 2.0.
servers:
  - url: https://api.shop.example/backoffice
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders, newest first
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 200
      responses:
        '200':
          description: a page of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: no such order
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      security:
        - backofficeToken: [orders:write]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: cancelled
        '409':
          description: already shipped
components:
  securitySchemes:
    backofficeToken:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.shop.example/token
          scopes:
            orders:write: change orders
  schemas:
    OrderStatus:
      type: string
      enum: [OPEN, PAID, SHIPPED, CANCELLED]
    Order:
      type: object
      required: [orderId, status, total]
      properties:
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
          format: double
        couponCode:
          type: string
          deprecated: true
