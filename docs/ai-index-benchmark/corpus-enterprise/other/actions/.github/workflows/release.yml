name: release-backoffice
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test
        run: mvn -B verify -Pci
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
  image:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: registry.shop.example
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Push the image
        run: |
          docker build -t registry.shop.example/orders-backoffice:${GITHUB_REF_NAME#v} .
          docker push registry.shop.example/orders-backoffice:${GITHUB_REF_NAME#v}
  deploy:
    needs: image
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: production
    secrets: inherit
