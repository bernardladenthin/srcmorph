apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-backoffice
  labels:
    app: orders-backoffice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-backoffice
  template:
    metadata:
      labels:
        app: orders-backoffice
    spec:
      containers:
        - name: backoffice
          image: registry.shop.example/orders-backoffice:2.1.0
          ports:
            - containerPort: 8080
          env:
            - name: SHOP_DB_URL
              value: jdbc:postgresql://orders-db:5432/shop
            - name: SHOP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          resources:
            limits:
              memory: 768Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-backoffice
spec:
  selector:
    app: orders-backoffice
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-backoffice
spec:
  rules:
    - host: backoffice.shop.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-backoffice
                port:
                  number: 80
