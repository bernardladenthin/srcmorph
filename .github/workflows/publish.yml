name: Publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_central:
        description: "Deploy to Maven Central (snapshot if -SNAPSHOT, release if a vX.Y.Z tag)"
        type: boolean
        default: false

# Supersede an in-flight run when a PR branch is pushed again.
#
# Without this every push starts a full parallel pipeline and the older ones keep
# draining -- four were live at once during one session, which makes "what is CI
# saying right now" genuinely ambiguous and wastes a lot of runner time on results
# nobody will read.
#
# cancel-in-progress is deliberately scoped to pull_request ONLY. A push to main or
# to a v* tag is a release path: cancelling one midway could leave a partially
# published set of artifacts.
#
# cancel-in-progress: false is NOT sufficient on its own to protect a release run.
# GitHub cancels a *pending* run whenever a newer run joins the same group behind an
# in-progress one -- that rule is independent of cancel-in-progress. So with a plain
# `workflow-ref` group, a queued `publish_to_central` dispatch on main could be
# silently dropped by a later push to main, both sharing `Publish-refs/heads/main`.
# Giving every non-PR run its own group (via the unique run_id) means such a run is
# never queued behind a sibling and therefore can never be cancelled, while PR runs
# still share a group per ref and supersede each other as intended.
#
# One-time effect when this expression changes: GitHub reads `concurrency` from the
# workflow file at each run's own ref, so a run started before the change sits in the
# old group and a run started after it sits in the new one. They are different groups,
# so the new push does NOT supersede the in-flight old run -- exactly once, on the
# commit that lands this. It self-heals from the next push on. Expect the same overlap
# when porting this to a sibling repo; it is not a sign the expression is wrong.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Start gate — single cancellable abort window before the pipeline starts.
  # The wait duration lives in the `startgate` GitHub Environment (Settings →
  # Environments → startgate → Wait timer).
  # ---------------------------------------------------------------------------
  startgate:
    name: Start gate (abort window)
    runs-on: ubuntu-latest
    environment: startgate
    steps:
      - run: echo "Start gate elapsed — proceeding with pipeline."

  # ---------------------------------------------------------------------------
  # The repository checks of bernardladenthin/actions, configured in
  # .github/actions-config.json: the files this repository keeps equal to the templates
  # there (replaced the shared-files.sha256 manifest), the release gate, bash -n over
  # every run script, Maven version drift against the sibling repositories (warnings
  # only), and the publication wiring plus a dry run of the release asset contract.
  # ---------------------------------------------------------------------------
  repository-checks:
    name: Repository checks
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Files equal their templates in bernardladenthin/actions
        uses: bernardladenthin/actions/common/check-templates@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - name: Release gate (every job gates both publish jobs, or release-gate-exemptions.txt says why)
        uses: bernardladenthin/actions/common/check-release-gate@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - name: Run scripts parse (bash -n over every bash run script of the workflows and actions)
        uses: bernardladenthin/actions/common/check-run-scripts@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - name: Maven versions (warns where a dependency or plugin differs from a sibling repository)
        uses: bernardladenthin/actions/java/check-maven-versions@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - name: Publication wiring and release asset contract (dry run)
        uses: bernardladenthin/actions/java/check-publication@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0

  # ---------------------------------------------------------------------------
  # GPG signing-key preflight (standalone, no `needs:` -- runs in parallel at the
  # very start on every trigger): what maven-gpg-plugin does at deploy time, so a
  # bad/expired key or wrong passphrase is caught in ~20s instead of failing the
  # publish stage. `environment: maven-central` gives it the SAME secret the publish
  # jobs use. EXPECTED to go RED where the secret is not delivered (fork PRs, other
  # contributors' branches): "this ref cannot sign a release", not a regression.
  # Prints only public key metadata; the security notes are in the action's script.
  # ---------------------------------------------------------------------------
  verify-signing-key:
    name: Verify GPG signing key (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: bernardladenthin/actions/common/verify-gpg-key@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

  # ---------------------------------------------------------------------------
  # The same key through Gradle's signing plugin + useInMemoryPgpKeys (BouncyCastle),
  # the path a Gradle publication (an Android AAR) signs with. BouncyCastle parses the
  # armored key more strictly than gpg, so it catches what the job above tolerates.
  # It signs the action's own throwaway project, so it is the same in every repository
  # ("prepared for Gradle"). Red by design where the secret is not delivered.
  # ---------------------------------------------------------------------------
  verify-signing-key-gradle:
    name: Verify GPG signing key — Gradle/BouncyCastle path (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bernardladenthin/actions/java/verify-signing-key-gradle@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          key-id: ${{ secrets.GPG_KEY_ID }}

  code-style:
    name: Code style (spotless) + package graph
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
      # spotless-maven-plugin / spotbugs-maven-plugin are declared only in each child module's own
      # <pluginManagement>/<build> (not the pom-packaging reactor root), so the bare prefix goals
      # (`spotless:check`, `spotbugs:check`) fail with "No plugin found for prefix" — Maven resolves
      # a short prefix against the INVOKING project (the root aggregator here), not the reactor
      # members, regardless of which modules actually end up executing. Using the fully-qualified
      # groupId:artifactId:goal form bypasses prefix resolution entirely (plugin *version* still
      # resolves correctly via each module's inherited pluginManagement pin); -pl restricts
      # execution to the three modules that actually declare the plugin, skipping the parent pom
      # and the source-less relocation stub, neither of which registers it anywhere.
      - name: Spotless check (fail fast on format violations)
        run: mvn -B --no-transfer-progress -pl srcmorph,srcmorph-cli,srcmorph-maven-plugin com.diffplug.spotless:spotless-maven-plugin:check
      - name: SpotBugs check (fail fast on static-analysis findings)
        run: mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true -pl srcmorph,srcmorph-cli,srcmorph-maven-plugin compile com.github.spotbugs:spotbugs-maven-plugin:check
      - name: Print internal package dependency graph (jdeps, informational)
        continue-on-error: true
        run: |
          mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true compile
          # Three reactor modules each ship their own module-info.java / target/classes tree
          # (srcmorph, srcmorph-cli, srcmorph-maven-plugin) — print each separately.
          echo "=== internal package dependency graph (jdeps, bytecode) — srcmorph ==="
          jdeps -verbose:package srcmorph/target/classes | grep 'net.ladenthin.srcmorph' || true
          echo "=== internal package dependency graph (jdeps, bytecode) — srcmorph-cli ==="
          jdeps -verbose:package srcmorph-cli/target/classes | grep 'net.ladenthin.srcmorph' || true
          echo "=== internal package dependency graph (jdeps, bytecode) — srcmorph-maven-plugin ==="
          jdeps -verbose:package srcmorph-maven-plugin/target/classes | grep 'net.ladenthin.maven.srcmorph' || true

  build:
    name: Build
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Memory before tests
        run: free -h
      - name: Test
        # Reactor-wide (no -pl): runs every module's tests. The `jcstress` profile is only
        # declared in srcmorph-maven-plugin/pom.xml, so it activates there and is a
        # silent no-op for srcmorph/srcmorph-cli (neither declares a profile with that id).
        #
        # requireNativeLlama turns the model-backed tests' capability check from a skip into a
        # failure. Skipping is right on a developer machine with an unsupported OS/arch; here it
        # would mean a vanished native library or an unchecked-out model quietly restores a green
        # build with zero real inference — the exact shape that let a dead provider ship twice.
        run: >-
          mvn -e --batch-mode --no-transfer-progress -P jcstress
          -Dnet.ladenthin.srcmorph.requireNativeLlama=true verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report
          # srcmorph carries the bulk of the test suite (and the only PIT gate); its report is
          # the one forwarded to Coveralls/Codecov in the `report` job below, matching the
          # single-primary-module precedent already used by the sibling java-llama.cpp reactor
          # (which reports only its `llama` core module, not an aggregate across all modules).
          # srcmorph-cli / srcmorph-maven-plugin jacoco reports are not currently
          # aggregated or uploaded (documented gap, see TODO.md).
          path: srcmorph/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
      - name: Memory after tests
        if: always()
        run: free -h
      # Echo the crash logs into the job log (workspace/policies/ci-test-diagnostics.md 3.1).
      - name: Print crash logs (on failure)
        if: failure()
        uses: bernardladenthin/actions/java/print-crash-logs@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          modules: srcmorph srcmorph-cli srcmorph-maven-plugin
      - name: Upload crash & surefire dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crash-dumps-test
          # Repo-wide glob: a forked surefire JVM crash can happen in any of the three module
          # working directories (srcmorph / srcmorph-cli / srcmorph-maven-plugin), each
          # with its own target/ tree.
          path: |
            ${{ github.workspace }}/**/hs_err_pid*.log
            ${{ github.workspace }}/**/*.hprof
            ${{ github.workspace }}/**/target/surefire-reports/*.dump
            ${{ github.workspace }}/**/target/surefire-reports/*.dumpstream
            ${{ github.workspace }}/**/target/surefire-reports/*.txt
            ${{ github.workspace }}/**/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
      - name: Run PIT mutation tests
        # All three modules now carry a pitest-maven execution at mutationThreshold 100, so the
        # goal runs reactor-wide rather than scoped to srcmorph. `-am` is gone with the `-pl`:
        # a plain reactor invocation already builds each module's dependencies in order.
        # The timeout bounds a regression: PIT re-runs the real-model tests for every mutant they
        # cover, so a slow test multiplies. With threads(8) on this 4-vCPU runner one generation
        # took 431 s and the step ran for hours until cancelled (40316163607); with
        # NativeLlamaAvailability.THREADS the whole step takes minutes (7 in September).
        timeout-minutes: 60
        run: mvn --batch-mode --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Extract PIT survivors
        if: always()
        run: |
          echo "=== PIT Survived Mutations ==="
          for html_file in $(find */target/pit-reports -name "*.html" -type f 2>/dev/null | sort); do
            if grep -q "SURVIVED" "$html_file"; then
              echo "Found survivors in $html_file:"
              grep -B 2 -A 3 "SURVIVED" "$html_file"
              echo ""
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: { name: pit-reports, path: "*/target/pit-reports/" }

  vmlens:
    name: Test (vmlens interleavings)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { java-version-file: .java-version, distribution: temurin, cache: maven }
      - name: Test under vmlens (one class — staged scope)
        # VmlensInterleavingSmokeTest and the `vmlens` profile both live in
        # srcmorph-maven-plugin/pom.xml (they were not relocated during the core
        # extraction — see CLAUDE.md) — scope directly to that module rather than the whole
        # reactor. `-am` is required (not just an optimization): this module depends on srcmorph at
        # the reactor's own -SNAPSHOT version, and no repository this build resolves from carries a
        # -SNAPSHOT (Maven Central holds releases only, and no snapshot <repository> is declared), so
        # without `-am` its compile would fail trying to resolve that version. That in turn means
        # the `test` phase also runs for srcmorph, where -Dtest=VmlensInterleavingSmokeTest
        # matches no class — `-DfailIfNoTests=false` does NOT suppress that (it only covers "no
        # tests at all"); the actual guard for "the -Dtest pattern matched nothing" is
        # `-Dsurefire.failIfNoSpecifiedTests=false` (verified locally: omitting it fails the
        # build on srcmorph with "No tests matching pattern ... were executed!").
        run: >-
          mvn --batch-mode --no-transfer-progress -pl srcmorph-maven-plugin -am -Pvmlens test
          -Dtest=VmlensInterleavingSmokeTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vmlens-report
          path: srcmorph-maven-plugin/target/vmlens-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Jar smoke test. srcmorph publishes no runnable jar: a user builds one from
  # examples/build-your-own-jar (srcmorph-cli plus the natives of their OS/arch). This job takes
  # exactly that path against the commit under test: it installs the reactor into the runner's
  # local repository, builds the example with srcmorph.version and llama.version from the reactor,
  # and launches the result the way a user would. Unit tests run off target/classes and never
  # notice an unrunnable jar -- no Main-Class, a missing SLF4J binding, a Java 11 class on a Java 8
  # floor.
  #
  # config_Plan.json uses the `mock` generation provider, so this needs no GGUF model, no GPU and
  # no network beyond Maven -- the cheapest possible real launch of the CLI. `Plan` is the command
  # that cannot fail for configuration reasons (planOnly, nothing written); `All` over a real
  # source tree fails by design when files exceed the demo model's context window, which would make
  # the smoke non-deterministic rather than more thorough.
  # ---------------------------------------------------------------------------

  smoke-jar:
    name: Smoke test the user-built jar
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Install the reactor, then build examples/build-your-own-jar against it
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -DskipTests install
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n1)
          llama=$(mvn -q -DforceStdout -pl srcmorph help:evaluate -Dexpression=llama.version | tail -n1)
          echo "srcmorph $version, llama $llama"
          mvn --batch-mode --no-transfer-progress -f examples/build-your-own-jar/pom.xml             -Dsrcmorph.version="$version" -Dllama.version="$llama" package
          mkdir -p smoke-jars
          cp examples/build-your-own-jar/target/srcmorph.jar smoke-jars/
          cp "srcmorph-maven-plugin/target/srcmorph-maven-plugin-$version.jar" smoke-jars/
      # Class-file floor. Production code here targets Java 8, so anything a consumer's JVM
      # can load must be major 52 or lower -- a single Java 11 class (logback's
      # LogbackServiceProvider was the real case) kills the process with
      # UnsupportedClassVersionError before any of our code runs. srcmorph.jar holds the CLI with
      # its whole runtime classpath; the plugin jar is what Maven loads. module-info.class and
      # META-INF/versions/** are skipped because a classpath JVM never loads them. The
      # java/verify-bytecode action of bernardladenthin/actions.
      - name: Verify Java 8 bytecode (no class newer than major 52)
        uses: bernardladenthin/actions/java/verify-bytecode@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          max-major: "52"
          paths: |
            smoke-jars
      - name: Run the jar
        uses: bernardladenthin/actions/java/smoke-fatjar-cli@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          jar-dir: smoke-jars
          jar-glob: 'srcmorph.jar'
          work-dir: examples
          marker: 'Main#run end\.'
          args: config_Plan.json
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-jar-logs
          path: |
            smoke-out.log
            smoke-err.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Plugin integration test -- the only job that runs srcmorph-maven-plugin AS A PLUGIN.
  #
  # Every other check on that module calls Java methods directly (PluginArchitectureTest,
  # MojoPhaseSkipTest, MojoConfigurationMappingTest, PIT at 62/62), so nothing covers what only
  # Maven does: plexus binding of the <configuration> XML onto the @Parameter fields, goal-prefix
  # resolution, the srcmorph.* property strings, lifecycle-phase binding, and the descriptor
  # maven-plugin-plugin generates. A renamed @Parameter property shipped green before this job.
  #
  # needs: startgate, not build -- it compiles what it needs itself and consumes no uploaded
  # artifact, so hanging it off build would only serialize it behind a compile it repeats anyway.
  # ---------------------------------------------------------------------------
  plugin-it:
    name: Plugin integration test
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      # -pl srcmorph-maven-plugin -am resolves to exactly parent + srcmorph + the plugin;
      # srcmorph-cli is a leaf (CliArchitectureTest#cliIsLeaf), so its unconditionally
      # package-bound ~80 MB assembly never runs here. install (not package) because the fixture
      # resolves the plugin from the local repository. The skips drop work code-style and test
      # already do -- keeping them would roughly double the job for no extra signal.
      # Every assertion in this job is about Maven semantics (plexus binding, prefix resolution,
      # -D vs <configuration> precedence), so the log has to record which Maven produced the result.
      - name: Record the Maven version
        run: mvn -v
      - name: Install the plugin into the local repository
        run: >
          mvn -B --no-transfer-progress
          -pl srcmorph-maven-plugin -am
          -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
          -Dspotbugs.skip=true -Dspotless.check.skip=true -Denforcer.skip=true -Djacoco.skip=true
          install
      # Same form the publish jobs in this workflow already use; a hand-rolled sed over pom.xml
      # would be a second, weaker way of answering a question Maven answers exactly.
      - name: Resolve the reactor version
        id: version
        run: |
          set -euo pipefail
          v=$(mvn -B -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n1)
          [ -n "$v" ] || { echo "::error::could not resolve the reactor version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Run the plugin integration test
        run: .github/plugin-it.sh '${{ steps.version.outputs.version }}'
      - name: Upload integration-test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-it-logs
          path: |
            .github/plugin-it/target/logs/
            .github/plugin-it/target/ai/
          if-no-files-found: warn

  report:
    name: Report
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Only srcmorph's jacoco report is uploaded by the `test` job (see the comment there) —
      # it carries the bulk of the test suite and the only PIT gate. Coveralls/Codecov are
      # pointed at it directly rather than an aggregated multi-module report, matching the
      # single-primary-module precedent already used by the sibling java-llama.cpp reactor.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: jacoco-report, path: srcmorph/target/site/jacoco/ }
        continue-on-error: true
      # The dependency graph is submitted by dependency-submission.yml (on pushes to main, with the
      # JDK of .java-version), not here: this job gates the release path and needs no write access.
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: srcmorph/target/site/jacoco/jacoco.xml
          format: jacoco
        continue-on-error: true
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: srcmorph/target/site/jacoco/jacoco.xml
        continue-on-error: true

  check-snapshot:
    name: "Check: main branch / SNAPSHOT"
    needs: [report]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every project version ends in -SNAPSHOT before anything is published to the snapshot channel.
      # Only then: a push publishes nothing, and main carries the release version for the commit
      # a release is tagged on.
      - name: Require a SNAPSHOT version
        if: inputs.publish_to_central
        uses: bernardladenthin/actions/java/check-release-ref@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: snapshot

  check-tag:
    name: "Check: v* tag"
    needs: [report]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The tag names exactly the project version (v1.2.3 for 1.2.3), which is no SNAPSHOT.
      - name: Require the release version the tag names
        uses: bernardladenthin/actions/java/check-release-ref@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: release

  publish-snapshot:
    name: Prepare and verify signed snapshot artifacts
    needs:
      - check-snapshot
      - code-style
      - smoke-jar
      - plugin-it
      - repository-checks
      - vmlens
    if: needs.check-snapshot.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    outputs:
      assets_complete: ${{ steps.finalize.outputs.complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Guard - require a -SNAPSHOT version
        shell: bash
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n1)
          echo "Resolved project version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "OK: -SNAPSHOT version, continuing local snapshot staging." ;;
            *) echo "::error::Refusing to publish non-SNAPSHOT version '$VERSION' from the snapshot job. Snapshot publishing requires a -SNAPSHOT version; releases go through the v* tag path."; exit 1 ;;
          esac
      # The collect step runs actionlib of bernardladenthin/actions (on PYTHONPATH from here).
      - uses: bernardladenthin/actions/common/setup@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true help:effective-pom
      - name: Stage snapshot
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true deploy -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Collect signed Central artifacts (pom/jar/sources/javadoc)
        run: python3 -m actionlib.java.releaseassets central-assets --maven-only
      - name: Finalize and secure the signed publication
        id: finalize
        uses: bernardladenthin/actions/java/finalize-publication@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: snapshot
          maven-assets: central-assets

  github-snapshot:
    name: Update Snapshot Pre-release on GitHub
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: bernardladenthin/actions/java/publish-github@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: snapshot
          assets-complete: ${{ needs.publish-snapshot.outputs.assets_complete }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Prepare and verify signed release artifacts
    needs:
      - check-tag
      - code-style
      - smoke-jar
      - plugin-it
      - repository-checks
      - vmlens
    if: needs.check-tag.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    outputs:
      assets_complete: ${{ steps.finalize.outputs.complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # The collect step runs actionlib of bernardladenthin/actions (on PYTHONPATH from here).
      - uses: bernardladenthin/actions/common/setup@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true help:effective-pom
      - name: Stage release
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true deploy -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Collect signed Central artifacts (pom/jar/sources/javadoc)
        run: python3 -m actionlib.java.releaseassets central-assets --maven-only
      - name: Finalize and secure the signed publication
        id: finalize
        uses: bernardladenthin/actions/java/finalize-publication@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: release
          maven-assets: central-assets

  github-release:
    name: Attach Binaries to GitHub Release
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: bernardladenthin/actions/java/publish-github@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: release
          assets-complete: ${{ needs.publish-release.outputs.assets_complete }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  central-snapshot:
    name: Upload checked snapshot artifacts to Maven Central
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    # One transfer at a time; an older commit finishing late is skipped (the superseded check).
    concurrency:
      group: central-snapshot-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
        uses: bernardladenthin/actions/java/publish-central@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: snapshot
          assets-complete: ${{ needs.publish-snapshot.outputs.assets_complete }}
          username: ${{ secrets.CENTRAL_USERNAME }}
          password: ${{ secrets.CENTRAL_TOKEN }}

  central-release:
    name: Upload checked release artifacts to Maven Central
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
        uses: bernardladenthin/actions/java/publish-central@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: release
          assets-complete: ${{ needs.publish-release.outputs.assets_complete }}
          username: ${{ secrets.CENTRAL_USERNAME }}
          password: ${{ secrets.CENTRAL_TOKEN }}

  attest-snapshot:
    name: Attest the checked snapshot publication
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: bernardladenthin/actions/java/attest-publication@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: snapshot
          assets-complete: ${{ needs.publish-snapshot.outputs.assets_complete }}

  attest-release:
    name: Attest the checked release publication
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: bernardladenthin/actions/java/attest-publication@44390bd464395f560f4170d2c4bfb7a6348541b3 # v1.1.0
        with:
          channel: release
          assets-complete: ${{ needs.publish-release.outputs.assets_complete }}
